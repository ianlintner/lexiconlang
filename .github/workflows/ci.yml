name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Upload sample-output artifact
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: samples-${{ github.sha }}
          path: tests/__artifacts__/
          if-no-files-found: error
          retention-days: 30

  smoke-cli:
    name: cli smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: build-markov via CLI
        run: |
          mkdir -p ./_smoke
          cat > ./_smoke/corpus.json <<'EOF'
          ["alice", "bob", "carol", "dave", "eve", "frank", "grace", "henry"]
          EOF
          node packages/cli/dist/index.js build-markov ./_smoke/corpus.json --out ./_smoke/model.json --order 2
          test -s ./_smoke/model.json
          jq -e '.v == 1 and (.transitions | length) > 0' ./_smoke/model.json
