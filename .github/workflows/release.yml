name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @changesets/cli v3 requires Node.js >=22.11 (PR #34 must land first).
          node-version: "22"
          cache: "pnpm"
          # changesets/action v2 no longer writes .npmrc from NPM_TOKEN, so let
          # setup-node configure registry auth for the publish script instead.
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          # v2 renamed the root inputs: `publish` -> `publish-script`,
          # `title` -> `pr-title`; the token is now a first-class input rather
          # than being read from the GITHUB_TOKEN environment variable.
          publish-script: pnpm release
          pr-title: "chore: release packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NODE_AUTH_TOKEN is what the .npmrc written by setup-node reads.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          gh release create v$VERSION \
            --title "v$VERSION" \
            --notes "Release of lexiconlang v$VERSION" \
            --generate-notes
